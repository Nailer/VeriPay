# Envio HyperIndex config for VeriPay's on-chain reputation feed.
#
# Why this exists: VeriPay's escrow already writes a permanent event for
# every trade outcome (created, released, disputed, resolved, refunded).
# Reputation here is not a number we store and could quietly edit — it's
# derived entirely by replaying those public events, so anyone can
# independently re-derive the same score straight from the chain. Monad's
# near-zero fees are what make writing one of these events per trade
# affordable at any transaction size in the first place; Envio is what makes
# querying the resulting history fast enough to show on a trade page.
#
# Points at the live VeriPayEscrow deployment on Monad testnet (hackathon/metropolis).
# If the contract is ever redeployed, update address + start_block below.
name: veripay-reputation
description: On-chain reputation for VeriPay escrow addresses, derived from trade history.

contracts:
  - name: VeriPayEscrow
    handler: src/EventHandlers.ts
    events:
      - event: "TradeCreated(uint256 indexed id, address indexed buyer, address indexed seller, uint256 amount)"
      - event: "TradeToken(uint256 indexed id, address indexed token)"
      - event: "FundsReleased(uint256 indexed id, address to)"
      - event: "DisputeRaised(uint256 indexed id, address by)"
      - event: "DisputeResolved(uint256 indexed id, uint256 toBuyer, uint256 toSeller)"

chains:
  - id: 10143 # Monad testnet — served by Envio HyperSync (monad-testnet.hypersync.xyz)
    start_block: 63987883 # block VeriPayEscrow was deployed in; nothing to index before it
    contracts:
      - name: VeriPayEscrow
        address: "0x00bdf9fbc9f59cc6814bbc7a91b19bbad1517e6d"
